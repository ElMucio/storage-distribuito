# Configurazione di nginx.
# Il client parla solo con nginx (porta 8000);
# nginx distribuisce le richieste fra broker1 e broker2 in round-robin.

# Di default e' round-robin.
upstream brokers {
    server broker1:8000;
    server broker2:8000;
}

server {
    listen 80;
    server_name _;

    # limite del body:
    client_max_body_size 100M;

    location / {
        
        # proxy_pass su tutto: nginx sceglie un broker (round-robin)
        # e gli inoltra la richiesta. Se quel broker non risponde,
        # nginx riprova in automatico sull'altro (proxy_next_upstream default).
        proxy_pass http://brokers;

        # Header per passare l'identita' del client al broker.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
